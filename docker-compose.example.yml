name: self-learn

services:
  api:
    build:
      context: ./server
    image: self-learn-api:local
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      ULEARN_DB: /data/ulearn.db
      COURSES_ROOT: /app/courses
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4173}
    volumes:
      - ./data:/data
      - ./courses:/app/courses:ro
    ports:
      - "0.0.0.0:${API_PORT:-8000}:8000"
  web:
    build:
      context: ./frontend
    image: self-learn-web:local
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "0.0.0.0:${WEB_PORT:-4173}:4173"
